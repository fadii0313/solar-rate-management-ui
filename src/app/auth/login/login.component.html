<div class="auth-container">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  
  <div class="auth-card-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2V6M12 18V22M4.93 4.93L7.76 7.76M16.24 16.24L19.07 19.07M2 12H6M18 12H22M4.93 19.07L7.76 16.24M16.24 7.76L19.07 4.93" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="5" fill="url(#logoGrad)"/>
            <defs>
              <linearGradient id="logoGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00f2fe"/>
                <stop offset="100%" stop-color="#4facfe"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1>SOLAR RATE</h1>
        <p class="subtitle">Daily Price Entry Gateway</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <!-- Error Banner -->
        <div *ngIf="error" class="error-banner animate-fade-in">
          <span class="error-icon">⚠️</span>
          <span class="error-msg">{{ error }}</span>
        </div>

        <!-- Username field -->
        <div class="form-group" [class.has-error]="submitted && f['username'].errors">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input 
              type="text" 
              id="username" 
              formControlName="username" 
              placeholder="Enter your username"
              autocomplete="username"
            />
          </div>
          <div *ngIf="submitted && f['username'].errors" class="validation-message">
            <span *ngIf="f['username'].errors['required']">Username is required</span>
            <span *ngIf="f['username'].errors['minlength']">Must be at least 3 characters</span>
          </div>
        </div>

        <!-- Password field -->
        <div class="form-group" [class.has-error]="submitted && f['password'].errors">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              formControlName="password" 
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>
          <div *ngIf="submitted && f['password'].errors" class="validation-message">
            <span *ngIf="f['password'].errors['required']">Password is required</span>
            <span *ngIf="f['password'].errors['minlength']">Must be at least 4 characters</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" [disabled]="loading" class="btn-submit">
          <span *ngIf="!loading">Sign In</span>
          <div *ngIf="loading" class="spinner"></div>
        </button>
      </form>
    </div>
    
    <div class="auth-footer">
      <p>&copy; 2026 Solar Rate Management System. All rights reserved.</p>
    </div>
  </div>
</div>
